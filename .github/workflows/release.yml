name: Release

# Push a tag like v0.1.0 to build installers and publish them to a GitHub
# Release. Assets get stable names so these links always point at the newest
# version:
#   https://github.com/Nyaughh/roomy/releases/latest/download/Roomy-setup-x64.exe
#   https://github.com/Nyaughh/roomy/releases/latest/download/Roomy-x64.msi
#   https://github.com/Nyaughh/roomy/releases/latest/download/Roomy-macos.dmg
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Roomy ${TAG#v}" --notes "Roomy ${TAG#v}. Make room.

          **Windows:** download \`Roomy-setup-x64.exe\` (or \`Roomy-x64.msi\`).
          **macOS:** download \`Roomy-macos.dmg\` (Apple Silicon and Intel).

          These builds aren't code-signed yet. On Windows choose *More info → Run anyway* in SmartScreen; on macOS right-click Roomy and choose *Open* the first time."
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
      - name: Collect installers with stable names
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp app/src-tauri/target/release/bundle/nsis/*-setup.exe out/Roomy-setup-x64.exe
            cp app/src-tauri/target/release/bundle/msi/*.msi out/Roomy-x64.msi
          else
            cp app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg out/Roomy-macos.dmg
          fi
          ls -l out
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" out/* --clobber
