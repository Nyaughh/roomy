name: CI

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/ci.yml"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      # The Tauri build embeds the frontend, so it must exist before compiling.
      - name: Build frontend
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: cargo fmt
        working-directory: app/src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: app/src-tauri
        run: cargo test
